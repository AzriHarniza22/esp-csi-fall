<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wi-Fi Sensing Radar — Remote Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e9ef; --muted: #8b93a7;
    --ok: #3ecf8e; --warn: #e0b341; --bad: #ef5f5f;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --line:#e2e5ea; --fg:#1a1d23; --muted:#5c6478; }
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  #status { font-weight: 600; }
  #status.up { color: var(--ok); } #status.down { color: var(--bad); }
  main { padding: 12px 16px 24px; }
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .card .v { font-size: 21px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .peer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .peer h2 { margin: 0 0 8px; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.motion { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.ready { background: var(--ok); }
  canvas { width: 100%; height: 128px; display: block; }
  .legend { display: flex; gap: 18px; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 12px; height: 3px; border-radius: 2px; }
  footer { padding: 0 16px 26px; color: var(--muted); font-size: 11.5px; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px; margin-bottom: 12px; }
  .panel h2 { margin: 0 0 9px; font-size: 14.5px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  input, select {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; min-width: 88px;
  }
  button {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 15px; font: inherit; font-weight: 600;
    min-height: 40px; cursor: pointer;
  }
  button.primary { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #pending { margin-top: 9px; font-size: 12px; color: var(--muted); min-height: 18px; }
  #pending.busy { color: var(--warn); }
  #pending.ok { color: var(--ok); }
  #pending.fail { color: var(--bad); }
  #acks { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #acks summary { cursor: pointer; }
  #acklist { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  #acklist div { white-space: pre-wrap; word-break: break-word; }
  #acklist .t { color: var(--fg); opacity: .55; }
  .link { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
</style>
</head>
<body>
<header>
  <h1>Wi-Fi Sensing Radar</h1>
  <div class="sub">Broker: <span id="status" class="down">connecting…</span></div>
</header>

<main>
  <div class="cards">
    <div class="card"><div class="k">Peers</div><div class="v" id="c-peers">0</div></div>
    <div class="card"><div class="k">Moving</div><div class="v" id="c-motion">0</div></div>
    <div class="card"><div class="k">Device</div><div class="v" id="c-online">—</div></div>
    <div class="card"><div class="k">Updates/s</div><div class="v" id="c-rate">0.0</div></div>
  </div>
  <div class="panel">
    <h2>Controls</h2>
    <div class="row">
      <div class="field">
        <label>HT stimulus</label>
        <select id="f-stim">
          <option value="on">on</option>
          <option value="off">off</option>
        </select>
      </div>
      <div class="field">
        <label>Burst bytes</label>
        <input id="f-burst" type="number" min="1000" max="1000000" step="1000" value="200000">
      </div>
      <div class="field">
        <label>Pause ms</label>
        <input id="f-pause" type="number" min="10" max="5000" step="10" value="100">
      </div>
      <div class="field">
        <label>Auto reconnect</label>
        <select id="f-recon">
          <option value="1">enabled</option>
          <option value="0">disabled</option>
        </select>
      </div>
      <button class="primary" id="b-apply">Apply</button>
      <button id="b-refresh">Refresh</button>
    </div>
    <div id="pending"></div>
    <div class="link" id="link"></div>
    <details id="acks">
      <summary>replies</summary>
      <div id="acklist"></div>
    </details>
  </div>

  <div id="peers"></div>
</main>

<footer>
  Samples are published by the ESP32 to <code id="topic">radar/esp32</code>. A flat
  trace means the access point stopped sending OFDM frames, not that the broker
  went away — see the note in the firmware.
</footer>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
"use strict";

// Same values the web serial monitor parses, so both UIs read one firmware.
const PREFIX = "radar/esp32";
const HOST = "z4e56ccf.ala.asia-southeast1.emqxsl.com";
const USER = "esp32";
const PASS = "esp32";
const WINDOW = 180;          // points kept per peer
const HISTORY_MS = 120000;   // chart time span

const state = new Map();
const statusEl = document.getElementById("status");
const peersEl = document.getElementById("peers");
let lastMsg = 0, msgWindow = [];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function peerNode(name) {
  const wrap = el("div", "peer");
  const h = el("h2");
  const dot = el("span", "dot");
  h.append(dot, el("span", null, name));
  const meta = el("span", "sub");
  h.append(meta);
  const cv = el("canvas");
  const legend = el("div", "legend");
  const sw1 = el("span"); const a = el("span", "swatch"); a.style.background = "#4da3ff";
  sw1.append(a, document.createTextNode("jitter"));
  const sw2 = el("span"); const b = el("span", "swatch"); b.style.background = "#3ecf8e";
  sw2.append(b, document.createTextNode("wander"));
  legend.append(sw1, sw2);
  wrap.append(h, cv, legend);
  peersEl.append(wrap);
  return { wrap, dot, meta, cv, ctx: cv.getContext("2d") };
}

function render(peer) {
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue("--line").trim();
  const fg = css.getPropertyValue("--fg").trim();
  const dpr = window.devicePixelRatio || 1;
  const w = peer.cv.clientWidth, h = peer.cv.clientHeight;
  if (peer.cv.width !== w * dpr || peer.cv.height !== h * dpr) {
    peer.cv.width = w * dpr; peer.cv.height = h * dpr;
  }
  const c = peer.ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  const now = Date.now();
  const cutoff = now - HISTORY_MS;
  while (peer.t.length && peer.t[0].t < cutoff) peer.t.shift();

  let max = 0.02;
  for (const p of peer.t) if (p.j > max) max = p.j;
  max *= 1.15;

  c.strokeStyle = line; c.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (h / 4) * i;
    c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
  }

  /*
   * Drawn as separate strokes, lifted where the stream has a hole in it.
   *
   * The unit only publishes when a reading changes, so gaps are ordinary and
   * say nothing about the room. Joining across one with a straight line would
   * claim a steady value the unit never reported, which is exactly the
   * misreading that made an earlier flat-line bug so hard to see.
   */
  const plot = (key, color) => {
    c.strokeStyle = color; c.lineWidth = 1.8;
    let started = false;
    for (let i = 0; i < peer.t.length; i++) {
      const p = peer.t[i];
      const prev = i ? peer.t[i - 1] : null;
      const x = w - ((now - p.t) / HISTORY_MS) * w;
      const y = h - (p[key] / max) * h;
      const bridged = prev && (p.t - prev.t) > GAP_MS;
      if (!started || bridged) { c.beginPath(); c.moveTo(x, y); started = true; }
      else c.lineTo(x, y);
      if (bridged) c.stroke();
    }
    c.stroke();
  };
  plot("w", "#3ecf8e");
  plot("j", "#4da3ff");

  c.fillStyle = fg; c.globalAlpha = 0.55; c.font = "11px system-ui";
  c.fillText(max.toFixed(3), 4, 12);
  c.globalAlpha = 1;
}

/*
 * Silence is ambiguous here: it can mean the unit is gone, or that the AP
 * stopped sending frames it can measure, or that the link to the broker is
 * down. Rather than guess, the header says plainly that the last update was N
 * seconds ago so a flat trace is never mistaken for a quiet room.
 */
function tick() {
  let moving = 0, ready = 0;
  for (const [, peer] of state) {
    render(peer);
    if (peer.motion) moving++;
    if (peer.ready) ready++;
  }
  document.getElementById("c-peers").textContent = state.size;
  document.getElementById("c-motion").textContent = moving;
  msgWindow = msgWindow.filter(t => Date.now() - t < 1000);
  document.getElementById("c-rate").textContent = msgWindow.length.toFixed(1);

  const age = lastMsgAt ? (Date.now() - lastMsgAt) / 1000 : null;
  const onlineEl = document.getElementById("c-online");
  if (age === null) {
    onlineEl.textContent = "no data yet";
  } else if (age > 30) {
    onlineEl.textContent = "stale " + Math.round(age) + "s";
  } else if (lastStatus) {
    onlineEl.textContent = !lastStatus.online ? "offline"
      : lastStatus.uplink_failing ? "path down" : "online";
  }
}

/*
 * A timer rather than requestAnimationFrame: Chrome pauses rAF in a background
 * tab, which is exactly when someone leaves this dashboard open to check later.
 * Rendering is cheap enough at 5 Hz, and the redraw loop stays alive.
 */
setInterval(tick, 200);
window.addEventListener("resize", tick);

/* ------------------------------------------------------------- control --- */

const pendingEl = document.getElementById("pending");
const linkEl = document.getElementById("link");
const fStim = document.getElementById("f-stim");
const fBurst = document.getElementById("f-burst");
const fPause = document.getElementById("f-pause");
const fRecon = document.getElementById("f-recon");
const bApply = document.getElementById("b-apply");
const bRefresh = document.getElementById("b-refresh");

/*
 * A command is not treated as done when it is sent. The unit answers with a
 * full state snapshot on radar/esp32/status, and only that snapshot counts as
 * confirmation.
 *
 * This matters because the link to the broker is not dependable. Measured on
 * this unit: telemetry arrives about once a second, the state snapshot about
 * half the time it is sent, and a command published from the phone can take
 * 20 s or vanish entirely. The ack is not reliable enough to detect that.
 * So the button keeps re-sending until the state it wanted shows up, over a
 * window wide enough for this link, and then says plainly that it failed
 * instead of pretending it worked.
 */
let pendingCmd = null;   // { want, tries, timer }
const MAX_TRIES = 6;
const RETRY_MS = 8000;

function stateMatches(want) {
  /* A refresh asks for information rather than changing anything, so it has no
   * state to confirm and must not be judged against one. */
  if (!lastStatus || !want) return false;
  for (const [k, v] of Object.entries(want)) {
    if (k === "stimulus") {
      for (const [sk, sv] of Object.entries(v)) {
        if (lastStatus.stimulus?.[sk] !== sv) return false;
      }
    } else if (lastStatus[k] !== v) {
      return false;
    }
  }
  return true;
}

function setPending(cls, text) {
  pendingEl.className = cls;
  pendingEl.textContent = text;
}

function sendCommand(want, build) {
  clearTimeout(pendingCmd?.timer);
  pendingCmd = { want, build, tries: 0, corr: null };
  pushOnce();
}

/*
 * A correlation id is minted per attempt, not per command. If an attempt is
 * lost, the reply to it can still turn up late; reusing one id across retries
 * would let that stale reply be mistaken for the answer to a later attempt.
 */
function newCorrelation() {
  const b = new Uint8Array(6);
  crypto.getRandomValues(b);
  return b;
}

function pushOnce() {
  if (!pendingCmd) return;
  pendingCmd.tries++;
  const corr = newCorrelation();
  pendingCmd.corr = corr;
  const line = pendingCmd.build();
  setPending("busy",
    `sent (${pendingCmd.tries}/${MAX_TRIES}), waiting for the unit's reply…`);
  client.publish(`${PREFIX}/cmd`, `HMSCMD ${line}`, {
    qos: 1,
    properties: { responseTopic: respTopic, correlationData: corr },
  });
  pendingCmd.timer = setTimeout(() => {
    if (!pendingCmd) return;
    /*
     * A reply is the answer. The state snapshot is only consulted when none
     * arrived, because a command can change state that the snapshot has not
     * caught up with yet, and that is not the same as the command having been
     * refused.
     */
    if (stateMatches(pendingCmd.want)) {
      setPending("ok", "confirmed by the unit's state.");
      pendingCmd = null;
      return;
    }
    if (pendingCmd.tries >= MAX_TRIES) {
      setPending("fail",
        "no reply after " + MAX_TRIES + " attempts (" +
        (MAX_TRIES * RETRY_MS / 1000) + " s). The unit may be offline or the " +
        "link is down — the values below are the last known state.");
      pendingCmd = null;
      return;
    }
    pushOnce();
  }, RETRY_MS);
}

/*
 * A matched reply settles the command immediately. Anything on the response
 * topic that does not carry the correlation currently in flight is ignored,
 * so a late reply from an abandoned attempt cannot confirm the current one.
 */
function onResponse(corr, payload) {
  if (!pendingCmd || !pendingCmd.corr) return;
  if (!corr || corr.length !== pendingCmd.corr.length) return;
  for (let i = 0; i < corr.length; i++) {
    if (corr[i] !== pendingCmd.corr[i]) return;
  }
  clearTimeout(pendingCmd.timer);
  const tries = pendingCmd.tries;
  const wasRefresh = pendingCmd.refresh;
  pendingCmd = null;
  recordAck(payload);
  if (wasRefresh) {
    setPending("ok", "the unit answered.");
    return;
  }
  setPending("ok", `the unit replied (attempt ${tries}).`);
}

bApply.addEventListener("click", () => {
  if (!lastStatus) {
    setPending("fail", "no state from the unit yet, nothing to change.");
    return;
  }
  const burst = Math.max(1000, Math.min(1000000, parseInt(fBurst.value, 10) || 0));
  const pause = Math.max(10, Math.min(5000, parseInt(fPause.value, 10) || 0));
  const stimOn = fStim.value === "on";
  const recon = fRecon.value === "1";

  // Only resend what actually differs, otherwise every tap becomes traffic.
  const lines = [];
  if (stimOn) lines.push(`SET_STIMULUS on ${burst} ${pause}`);
  else lines.push(`SET_STIMULUS off`);

  sendCommand(
    { stimulus: stimOn
        ? { enabled: true, burst_bytes: burst, pause_ms: pause }
        : { enabled: false } },
    () => lines[0]
  );
});

/* A refresh changes nothing, so it just asks once and does not start the
 * retry loop that would otherwise fire for a command that cannot "confirm". */
bRefresh.addEventListener("click", () => {
  clearTimeout(pendingCmd?.timer);
  const corr = newCorrelation();
  /*
   * A refresh changes nothing, so there is no state to confirm. The reply is
   * the whole answer here, and it arrives as a proper round trip like every
   * other command, which also means it doubles as a check that the unit is
   * answering at all.
   */
  pendingCmd = { want: null, build: () => "GET_STIMULUS", tries: 1, corr, refresh: true };
  setPending("busy", "asked the unit for its current settings…");
  client.publish(`${PREFIX}/cmd`, "HMSCMD GET_STIMULUS", {
    qos: 1,
    properties: { responseTopic: respTopic, correlationData: corr },
  });
});

/* -------------------------------------------------------------- ingest --- */

let lastStatus = null;
let lastMsgAt = 0;

function applyStatus(d) {
  lastStatus = d;
  lastMsgAt = Date.now();

  /*
   * Confirm here rather than waiting for the retry timer, so the button settles
   * the moment the unit's own snapshot reports the change.
   */
  if (pendingCmd && stateMatches(pendingCmd.want)) {
    clearTimeout(pendingCmd.timer);
    const tries = pendingCmd.tries;
    pendingCmd = null;
    setPending("ok", `confirmed by the unit's state (attempt ${tries}).`);
  }
  document.getElementById("c-online").textContent = d.online ? "online" : "offline";
  if (d.stimulus) {
    fStim.value = d.stimulus.enabled ? "on" : "off";
    if (document.activeElement !== fBurst) fBurst.value = d.stimulus.burst_bytes;
    if (document.activeElement !== fPause) fPause.value = d.stimulus.pause_ms;
  }
  if (d.peers) Object.assign(peerMacs, d.peers);

  const bits = [];
  if (d.rssi !== undefined) bits.push(`${d.rssi} dBm`);
  if (d.channel) bits.push(`ch ${d.channel}`);

  /*
   * "Offline" is ambiguous from the outside: the unit can be powered and
   * answering perfectly while the path to the broker is dead, and that is a
   * fault on this side, not a dead device. The unit reports which it is, so the
   * page can say so instead of showing a bare "offline".
   */
  if (d.uplink_failing) {
    bits.push(`path down ${Math.round(d.uplink_down_s || 0)}s`);
    if (d.restarts) bits.push(`${d.restarts} restart(s) so far`);
  }
  linkEl.textContent = bits.join(" · ");
}

/*
 * A retained snapshot arrives the moment the page connects, which is how the
 * panel gets its initial values without waiting for a command to round-trip.
 */
const acklistEl = document.getElementById("acklist");
const peerMacs = {};
const ackLog = [];

/*
 * The last few replies, kept so a result that never changed the state is still
 * visible. Without this the panel would look identical whether a command was
 * accepted or quietly rejected.
 */
function recordAck(payload) {
  let shown = payload;
  try {
    const d = JSON.parse(payload);
    if (d && (d.cmd || d.ok !== undefined)) {
      shown = (d.ok ? "ok" : "rejected") + " · " + (d.cmd || "") +
        (d.detail ? " · " + d.detail : "");
    }
  } catch { /* not JSON, show it raw */ }
  ackLog.unshift({ t: new Date().toLocaleTimeString(), s: shown });
  ackLog.length = Math.min(ackLog.length, 5);
  acklistEl.replaceChildren(...ackLog.map(a => {
    const d = el("div");
    d.append(el("span", "t", a.t + "  "), document.createTextNode(a.s));
    return d;
  }));
}

/*
 * Telemetry keys are short because the unit sends these several times a second,
 * so a reading is p (peer), j (jitter), w (wander), m (motion), r (presence
 * ready), s (has signal) and t (uptime ms).
 */

/*
 * A break longer than this in the stream is drawn as a break rather than a
 * line. The unit genuinely stops publishing when nothing has changed, so a gap
 * is normal and is not an error; what must not happen is the chart drawing a
 * straight line across it and making a dropout look like a steady reading.
 */
const GAP_MS = 4000;

function onSample(topic, payload, packet) {
  let d;
  try { d = JSON.parse(payload); } catch { return; }
  lastMsgAt = Date.now();

  if (topic.endsWith("/status")) { applyStatus(d); return; }
  if (topic === respTopic) {
    onResponse(packet?.properties?.correlationData, payload);
    return;
  }
  if (topic.endsWith("/ack")) {
    /*
     * The shared topic still carries the unit's replies, which is what makes a
     * dashboard that was opened late able to show the last answer. Confirmation
     * itself comes from the per-request topic above.
     */
    recordAck(payload);
    return;
  }
  if (d.p === undefined || d.p === "status") return;

  let peer = state.get(d.p);
  if (!peer) {
    peer = peerNode(d.p);
    peer.t = []; peer.motion = false; peer.ready = false;
    state.set(d.p, peer);
  }
  const at = Date.now();
  peer.t.push({ t: at, j: d.j || 0, w: d.w || 0 });
  if (peer.t.length > WINDOW) peer.t.shift();
  peer.motion = !!d.m;
  peer.ready = !!d.r;
  peer.dot.className = "dot" + (peer.motion ? " motion" : peer.ready ? " ready" : "");
  const mac = (peerMacs[d.p] || "").slice(0, 8);
  peer.meta.textContent =
    `${d.j.toFixed(4)} · ${d.w.toFixed(4)}` +
    (mac ? ` · ${mac}` : "") +
    (peer.motion ? " · MOVING" : peer.ready ? " · present" : "");
  msgWindow.push(at);
}

/*
 * MQTT 5 Request/Response.
 *
 * Each command carries a Response Topic and Correlation Data, and the unit
 * answers on that topic with the correlation echoed back. That turns a command
 * from "I hope it arrived" into a matched round trip, which matters on this
 * link: a publish can be swallowed while the same unit is perfectly reachable,
 * so confirming on the reply is the only way to know the command was really
 * run rather than merely sent.
 *
 * The topic is per client id, so several dashboards can be open at once without
 * seeing each other's replies.
 */
const clientId = "web_" + Math.random().toString(16).slice(2, 10);
let respTopic = `${PREFIX}/resp/${clientId}`;

const client = mqtt.connect(`wss://${HOST}:8084/mqtt`, {
  clientId,
  username: USER, password: PASS, keepalive: 45, clean: true,
  reconnectPeriod: 3000,
  protocolVersion: 5,
  /*
   * Anything older than this is treated as stale rather than drawn as a live
   * measurement, which is what the firmware's message expiry interval asks the
   * subscriber to do.
   */
  messageExpiryInterval: 60,
});

client.on("connect", () => {
  statusEl.textContent = "connected";
  statusEl.className = "up";
  client.subscribe(`${PREFIX}/peer/+`, { qos: 0 });
  client.subscribe(`${PREFIX}/status`, { qos: 1 });
  client.subscribe(`${PREFIX}/ack`, { qos: 1 });
  client.subscribe(respTopic, { qos: 1 });
});
client.on("reconnect", () => { statusEl.textContent = "reconnecting…"; statusEl.className = "down"; });
client.on("close", () => { statusEl.textContent = "disconnected"; statusEl.className = "down"; });
client.on("error", (e) => { statusEl.textContent = "error: " + e.message; statusEl.className = "down"; });
client.on("message", (topic, payload, packet) => onSample(topic, payload.toString(), packet));

document.getElementById("topic").textContent = PREFIX;
tick();
</script>
